name: Quality

# Fast pull-request quality gate: install, format, lint, style, type-check, and
# unit tests (Vitest). This is the first CI slice — heavier layers (local
# Supabase integration, Playwright E2E, deployment smoke) are added later per
# `.ai/2026-07-11-automated-test-suites.md` (Tasks 5–6, Task 7 Step 2).

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so only the latest commit is checked.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # Each check runs independently once install succeeds, so a single push
      # reports every failure at once instead of stopping at the first.
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      - name: Lint (ESLint)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Lint styles (Stylelint)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm stylelint

      - name: Lint Markdown
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm markdownlint

      - name: Type-check (svelte-check)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check

      - name: Unit tests (Vitest)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test
